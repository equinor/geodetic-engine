[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geodetic-engine"
version = "0.1.0"
description = "Geodetic transformation engine built on PROJ, with provenance and quality control"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pyproj==3.8.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "filelock>=3.16",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
    "pandas-stubs>=2.0",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8",
    "myst-nb>=1.2",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-mermaid>=1.0",
    "sphinx-argparse>=0.5",
    "sphinx-autodoc-typehints>=2.5",
    "sphinx-autobuild>=2024.10",
]

[project.scripts]
geodetic-projdb = "geodetic_engine.projdb.__main__:main"
geodetic-osdudb = "geodetic_engine.osdudb.__main__:main"

[project.urls]
Repository = "https://github.com/equinor/geodetic-engine"

[tool.uv]
no-binary-package = ["pyproj"]

[tool.hatch.build.targets.wheel]
packages = ["geodetic_engine"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not dataset"]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
markers = [
    "network: test requires a reachable Georepository instance and credentials",
    "dataset: exhaustive sweep of tests/testdataset; run with -m dataset",
    "regression: dataset record produced by PROJ alone (tier reference); a baseline of PROJ's output, not an independent check",
    "java_defect(id): states the correct behaviour for a defect of the OSDU crs-conversion-service Java bin grid implementation; see tests/bingrid/data/java_defects.json",
]

[tool.mypy]
python_version = "3.13"
strict = true

# pyproj re-exports through its packages without an explicit __all__, so strict
# mode reads every one of them as private. The imports are real public API.
[[tool.mypy.overrides]]
module = ["pyproj.*"]
implicit_reexport = true
