name: pyproj wheels

# pyproj's wheels on PyPI bundle the PROJ pyproj last released with, not the
# one this package pins. This builds pyproj with pyproj's own release tooling
# against the pinned PROJ, and a manual run with "publish" checked releases the
# wheels on GitHub. The documentation workflow lists them in a package index
# beside the docs, so that
#
#   pip install pygeodetic-engine "pyproj==3.8.0+proj9.9.0" --extra-index-url https://equinor.github.io/geodetic-engine/simple/
#
# installs pyproj with the pinned PROJ. No version is set here: PROJ and its
# checksum come from .devcontainer/install-proj.sh and pyproj from
# pyproject.toml, so the wheels bundle exactly the PROJ the tests ran against.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the wheels as a GitHub release and refresh the index
        type: boolean
        default: false
      rebuild_native:
        description: Rebuild native dependencies without using or saving caches
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/pyproj-wheels.yml
      - .devcontainer/install-proj.sh
      - pyproject.toml
      - scripts/check_pyproj_wheel.py
      - scripts/patch_pyproj_build.py
      - scripts/pyproj-manylinux.Dockerfile
      - scripts/pyproj_native_cache.py
      - tests/test_pyproj_native_cache.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    outputs:
      pyproj: ${{ steps.read.outputs.pyproj }}
      proj: ${{ steps.read.outputs.proj }}
      proj-sha256: ${{ steps.read.outputs.proj-sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned versions
        id: read
        run: |
          pyproj=$(grep -oP '"pyproj==\K[^"]+' pyproject.toml)
          proj=$(grep -oP '^PROJ_VERSION="\$\{PROJ_VERSION:-\K[^}]+' .devcontainer/install-proj.sh)
          sha=$(grep -oP '^PROJ_SHA256="\$\{PROJ_SHA256:-\K[^}]+' .devcontainer/install-proj.sh)
          echo "pyproj $pyproj with PROJ $proj ($sha)"
          {
            echo "pyproj=$pyproj"
            echo "proj=$proj"
            echo "proj-sha256=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    needs: pins
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep these manylinux defaults in sync with cibuildwheel below.
          - os: ubuntu-22.04
            arch: x86_64
            manylinux-image: quay.io/pypa/manylinux_2_28_x86_64@sha256:b74a5b6f1705ecff17be8bd792589bef9b3b039766d12205720ecd2a9e919192
          - os: ubuntu-22.04-arm
            arch: aarch64
            manylinux-image: quay.io/pypa/manylinux_2_28_aarch64@sha256:0333f44c4eb759ec8f47b27bc9dc27b1c929932a267cf13ce0cff1a4b758cccb
          - { os: macos-14, arch: arm64, macos-target: "14.0" }
          - { os: macos-15-intel, arch: x86_64, macos-target: "15.0" }
          - { os: windows-2022, arch: AMD64, triplet: x64-windows }
    env:
      PYPROJ_VERSION: ${{ needs.pins.outputs.pyproj }}
      PROJ_VERSION: ${{ needs.pins.outputs.proj }}
      PROJ_SHA256: ${{ needs.pins.outputs.proj-sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out pyproj ${{ env.PYPROJ_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: pyproj4/pyproj
          ref: ${{ env.PYPROJ_VERSION }}
          path: pyproj-src
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # proj-compile-wheels.sh downloads PROJ unchecked unless the archive is
      # already in archives/, so the checked one is put there first.
      - name: Fetch the PROJ source and check its checksum
        shell: bash
        run: |
          mkdir -p archives
          archive="archives/proj-${PROJ_VERSION}.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://download.osgeo.org/proj/proj-${PROJ_VERSION}.tar.gz" \
            || curl -fsSL --retry 3 -o "$archive" "https://github.com/OSGeo/PROJ/releases/download/${PROJ_VERSION}/proj-${PROJ_VERSION}.tar.gz"
          actual=$(cmake -E sha256sum "$archive" | cut -d' ' -f1)
          if [[ "$actual" != "$PROJ_SHA256" ]]; then
            echo "::error::$archive has SHA-256 $actual, expected $PROJ_SHA256"
            exit 1
          fi

      # The local version label distinguishes the wheels from PyPI's. Disable
      # embedded resources and make PROJ_DATA take precedence over the bundled
      # database, while retaining pyproj's explicit set_data_dir precedence.
      - name: Patch pyproj's build
        shell: bash
        run: |
          python scripts/patch_pyproj_build.py pyproj-src "$PYPROJ_VERSION" "$PROJ_VERSION"

      - name: Record the pyproj source revision
        id: pyproj-source
        shell: bash
        run: echo "revision=$(git -C pyproj-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # cibuildwheel copies the project into a container, so a host-directory
      # cache cannot retain its Linux build. Cache a manylinux image layer
      # instead; the Dockerfile builds PROJ at its original /project prefix.
      - name: Prepare the minimal manylinux build context
        if: runner.os == 'Linux'
        shell: bash
        run: |
          context="$RUNNER_TEMP/pyproj-native-context"
          mkdir -p "$context"
          cp pyproj-src/ci/proj-compile-wheels.sh "$context/"
          cp scripts/pyproj_native_cache.py "$context/"
          cp scripts/pyproj-manylinux.Dockerfile "$context/Dockerfile"
          cp "archives/proj-${PROJ_VERSION}.tar.gz" "$context/proj.tar.gz"
          echo "CIBW_MANYLINUX_X86_64_IMAGE=geodetic-pyproj-native:ci" >> "$GITHUB_ENV"
          echo "CIBW_MANYLINUX_AARCH64_IMAGE=geodetic-pyproj-native:ci" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: runner.os == 'Linux'

      - name: Build or restore the manylinux native image
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/pyproj-native-context
          load: true
          tags: geodetic-pyproj-native:ci
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          build-args: |
            BASE_IMAGE=${{ matrix.manylinux-image }}
            PROJ_VERSION=${{ env.PROJ_VERSION }}
            PROJ_SHA256=${{ env.PROJ_SHA256 }}
            PYPROJ_REVISION=${{ steps.pyproj-source.outputs.revision }}
          no-cache: ${{ inputs.rebuild_native == true }}
          cache-from: ${{ inputs.rebuild_native != true && format('type=gha,scope=pyproj-native-{0}', matrix.arch) || '' }}

      - name: Identify the Windows runner image
        id: windows-image
        if: runner.os == 'Windows' && inputs.rebuild_native != true
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion) -or
              [string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
            Write-Output "::warning::Windows image version or vcpkg root unavailable; vcpkg caching is disabled."
            Add-Content $env:GITHUB_OUTPUT "enabled=false"
          } else {
            $cachePath = "$env:VCPKG_INSTALLATION_ROOT/installed".Replace('\', '/')
            Add-Content $env:GITHUB_OUTPUT "enabled=true"
            Add-Content $env:GITHUB_OUTPUT "version=$env:ImageVersion"
            Add-Content $env:GITHUB_OUTPUT "path=$cachePath"
          }

      - name: Cache the vcpkg dependencies
        if: runner.os == 'Windows' && steps.windows-image.outputs.enabled == 'true' && inputs.rebuild_native != true
        uses: actions/cache@v4
        with:
          path: ${{ steps.windows-image.outputs.path }}
          key: ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-${{ steps.windows-image.outputs.version }}-${{ hashFiles('pyproj-src/ci/vcpkg.json', '.github/workflows/pyproj-wheels.yml') }}

      # Only PROJ's dependencies come from vcpkg, at the baseline pyproj pins.
      # PROJ itself is built from the checked archive, as on Linux and macOS,
      # so no platform waits for vcpkg to package a PROJ release.
      - name: Install PROJ's dependencies with vcpkg
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg_root=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")
          baseline=$(python -c "import json; print(json.load(open('pyproj-src/ci/vcpkg.json'))['builtin-baseline'])")

          mkdir -p vcpkg-manifest
          cat > vcpkg-manifest/vcpkg.json <<EOF
          {
            "dependencies": [{"name": "sqlite3", "features": ["tool"]}, "tiff", "curl"],
            "builtin-baseline": "$baseline"
          }
          EOF

          # Workaround for https://github.com/microsoft/vcpkg/issues/41199, as in
          # pyproj's workflow. Kept to this step: MSBuild, which CMake runs below,
          # fails on variables that differ only in case.
          export SystemDrive="$SYSTEMDRIVE" SystemRoot="$SYSTEMROOT" windir="$WINDIR"
          git -C "$vcpkg_root" pull --quiet
          "$vcpkg_root/bootstrap-vcpkg.bat" -disableMetrics
          "$vcpkg_root/vcpkg" install --x-manifest-root=vcpkg-manifest \
            --x-install-root="$vcpkg_root/installed" --triplet ${{ matrix.triplet }}

      - name: Set Windows native paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT.Replace('\', '/')
          $prefix = "$env:GITHUB_WORKSPACE/pyproj-src/pyproj/proj_dir".Replace('\', '/')
          Add-Content $env:GITHUB_ENV "PROJ_PREFIX=$prefix"
          Add-Content $env:GITHUB_ENV "VCPKG_BIN=$vcpkg/installed/${{ matrix.triplet }}/bin"

      - name: Identify the host native build
        id: native-key
        if: runner.os != 'Linux' && inputs.rebuild_native != true
        shell: bash
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_MACOS_TARGET: ${{ matrix.macos-target }}
          NATIVE_TRIPLET: ${{ matrix.triplet }}
          NATIVE_CONFIG_HASH: ${{ hashFiles('.github/workflows/pyproj-wheels.yml', 'scripts/patch_pyproj_build.py', 'scripts/pyproj_native_cache.py', 'pyproj-src/ci/vcpkg.json') }}
          PYPROJ_REVISION: ${{ steps.pyproj-source.outputs.revision }}
        run: python scripts/pyproj_native_cache.py key

      # The lookup avoids restoring a partial-prefix match. Only a verified
      # exact hit may bypass native compilation.
      - name: Look up a host native cache
        id: native-lookup
        if: runner.os != 'Linux' && steps.native-key.outputs.enabled == 'true' && inputs.rebuild_native != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native-key.outputs.paths }}
          key: ${{ steps.native-key.outputs.key }}
          lookup-only: true

      - name: Restore the host native cache
        id: native-cache
        if: steps.native-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native-key.outputs.paths }}
          key: ${{ steps.native-key.outputs.key }}

      - name: Reject a non-exact native cache
        if: steps.native-cache.outputs.cache-matched-key != '' && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "::error::A non-exact native cache was restored; refusing to build with it."
          exit 1

      - name: Build PROJ
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT.Replace('\', '/')
          $installed = "$vcpkg/installed"
          $triplet = '${{ matrix.triplet }}'
          $prefix = $env:PROJ_PREFIX
          $sqlite3 = Get-ChildItem "$installed/$triplet/tools" -Recurse -Filter sqlite3.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sqlite3) { throw "no sqlite3.exe under $installed/$triplet/tools" }

          cmake -E tar xzf "archives/proj-$env:PROJ_VERSION.tar.gz"
          cmake -S "proj-$env:PROJ_VERSION" -B proj-build -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            "-DVCPKG_INSTALLED_DIR=$installed" `
            "-DCMAKE_INSTALL_PREFIX=$prefix" `
            "-DEXE_SQLITE3=$sqlite3" `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_TESTING=OFF `
            -DBUILD_APPS=OFF `
            -DENABLE_TIFF=ON `
            -DENABLE_CURL=ON `
            -DEMBED_RESOURCE_FILES=OFF `
            -DUSE_ONLY_EMBEDDED_RESOURCE_FILES=OFF
          cmake --build proj-build --config Release --parallel
          cmake --install proj-build --config Release

      - name: Verify the Windows native PROJ installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/pyproj_native_cache.py verify windows "$env:PROJ_PREFIX" "$env:PROJ_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -PathType Container $env:VCPKG_BIN)) {
            throw "missing vcpkg binaries at $env:VCPKG_BIN"
          }

      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v4.3.4
        with:
          package-dir: pyproj-src
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp313-* cp314-* cp315-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: /usr/bin/python3 scripts/pyproj_native_cache.py restore-linux
          CIBW_BEFORE_ALL_MACOS: python scripts/pyproj_native_cache.py prepare-macos
          CIBW_ENVIRONMENT_LINUX: >-
            PROJ_WHEEL=true
            PROJ_VERSION=${{ env.PROJ_VERSION }}
            PROJ_SHA256=${{ env.PROJ_SHA256 }}
            PYPROJ_REVISION=${{ steps.pyproj-source.outputs.revision }}
            PROJ_DIR=/project/pyproj-src/pyproj/proj_dir
          CIBW_ENVIRONMENT_MACOS: >-
            PROJ_WHEEL=true
            PROJ_VERSION=${{ env.PROJ_VERSION }}
            NATIVE_CACHE_HIT=${{ steps.native-cache.outputs.cache-hit || 'false' }}
            PROJ_DIR=${{ github.workspace }}/pyproj-src/pyproj/proj_dir
            BUILD_PREFIX=${{ runner.temp }}/pyproj-deps
            CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}
            CPPFLAGS="-I${BUILD_PREFIX}/include ${CPPFLAGS}"
            PKG_CONFIG_PATH="${BUILD_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}"
            LDFLAGS="-L${BUILD_PREFIX}/lib -Wl,-rpath,${BUILD_PREFIX}/lib ${LDFLAGS} -Wl,-rpath,${{ github.workspace }}/pyproj-src/pyproj/proj_dir/lib"
          CIBW_ENVIRONMENT_WINDOWS: >-
            PROJ_WHEEL=true
            PROJ_VERSION=${{ env.PROJ_VERSION }}
            PROJ_DIR=${{ env.PROJ_PREFIX }}
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel
          # System32 explicitly: https://github.com/adang1345/delvewheel/issues/54
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path C:/Windows/System32
            --add-path ${{ env.PROJ_PREFIX }}/bin --add-path ${{ env.VCPKG_BIN }}
            -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python {project}/scripts/check_pyproj_wheel.py ${{ env.PROJ_VERSION }}

      # Test outside the modified image as well, so its /usr/local libraries
      # cannot hide a missing library in a repaired wheel.
      - name: Test Linux wheels in the clean manylinux image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --entrypoint bash \
            --env PROJ_VERSION \
            --volume "$GITHUB_WORKSPACE/wheelhouse:/wheelhouse:ro" \
            --volume "$GITHUB_WORKSPACE/scripts/check_pyproj_wheel.py:/check_pyproj_wheel.py:ro" \
            '${{ matrix.manylinux-image }}' -euo pipefail -c '
              shopt -s nullglob
              wheels=(/wheelhouse/*.whl)
              if [ "${#wheels[@]}" -ne 3 ]; then
                echo "expected three Linux wheels, found ${#wheels[@]}" >&2
                exit 1
              fi
              declare -A seen=()
              for wheel in "${wheels[@]}"; do
                case "$(basename "$wheel")" in
                  *-cp313-cp313-*) abi=cp313; python=/opt/python/cp313-cp313/bin/python ;;
                  *-cp314-cp314-*) abi=cp314; python=/opt/python/cp314-cp314/bin/python ;;
                  *-cp315-cp315-*) abi=cp315; python=/opt/python/cp315-cp315/bin/python ;;
                  *) echo "unexpected wheel: $wheel" >&2; exit 1 ;;
                esac
                if [[ -v "seen[$abi]" ]]; then
                  echo "duplicate Linux wheel for $abi" >&2
                  exit 1
                fi
                seen[$abi]=1
                "$python" -m pip install --no-cache-dir --force-reinstall "$wheel"
                "$python" /check_pyproj_wheel.py "$PROJ_VERSION"
              done
            '

      # Save native outputs only after all wheels and their smoke tests pass.
      - name: Verify host native outputs before caching
        if: runner.os != 'Linux' && steps.native-key.outputs.enabled == 'true' && inputs.rebuild_native != true && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          PROJ_DIR: ${{ github.workspace }}/pyproj-src/pyproj/proj_dir
          BUILD_PREFIX: ${{ runner.temp }}/pyproj-deps
          NATIVE_CACHE_HIT: "true"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            python scripts/pyproj_native_cache.py prepare-macos
          else
            python scripts/pyproj_native_cache.py verify windows "$PROJ_DIR" "$PROJ_VERSION"
          fi

      - name: Save the manylinux native cache
        if: runner.os == 'Linux' && inputs.rebuild_native != true
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/pyproj-native-context
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          build-args: |
            BASE_IMAGE=${{ matrix.manylinux-image }}
            PROJ_VERSION=${{ env.PROJ_VERSION }}
            PROJ_SHA256=${{ env.PROJ_SHA256 }}
            PYPROJ_REVISION=${{ steps.pyproj-source.outputs.revision }}
          cache-to: type=gha,scope=pyproj-native-${{ matrix.arch }},mode=min,ignore-error=true

      - name: Save the host native cache
        if: runner.os != 'Linux' && steps.native-key.outputs.enabled == 'true' && inputs.rebuild_native != true && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native-key.outputs.paths }}
          key: ${{ steps.native-key.outputs.key }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [pins, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
      actions: write  # start the documentation workflow, which writes the index
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYPROJ_VERSION: ${{ needs.pins.outputs.pyproj }}
      PROJ_VERSION: ${{ needs.pins.outputs.proj }}
      TAG: pyproj-${{ needs.pins.outputs.pyproj }}-proj${{ needs.pins.outputs.proj }}
      INDEX: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple/
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Write the checksums
        working-directory: dist
        run: sha256sum -- *.whl > SHA256SUMS

      # Fails if the release exists. A published wheel is never replaced: pip
      # caches and lock files hold its hash. Delete the release to rebuild.
      - name: Create the release
        run: |
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS \
            --target "$GITHUB_SHA" --latest=false \
            --title "pyproj $PYPROJ_VERSION with PROJ $PROJ_VERSION" \
            --notes "pyproj $PYPROJ_VERSION built against PROJ $PROJ_VERSION for geodetic-engine. Install with \`pip install pygeodetic-engine \"pyproj==$PYPROJ_VERSION+proj$PROJ_VERSION\" --extra-index-url $INDEX\`."

      - name: Refresh the package index
        run: gh workflow run docs.yml --ref "${{ github.event.repository.default_branch }}"
