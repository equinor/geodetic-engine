name: pyproj wheels

# pyproj's wheels on PyPI bundle the PROJ pyproj last released with, not the
# one this package pins. This builds pyproj with pyproj's own release tooling
# against the pinned PROJ, and a manual run with "publish" checked releases the
# wheels on GitHub. The documentation workflow lists them in a package index
# beside the docs, so that
#
#   pip install pygeodetic-engine "pyproj==3.8.0+proj9.9.0" --extra-index-url https://equinor.github.io/geodetic-engine/simple/
#
# installs pyproj with the pinned PROJ. No version is set here: PROJ and its
# checksum come from .devcontainer/install-proj.sh and pyproj from
# pyproject.toml, so the wheels bundle exactly the PROJ the tests ran against.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the wheels as a GitHub release and refresh the index
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/pyproj-wheels.yml
      - .devcontainer/install-proj.sh
      - pyproject.toml
      - scripts/check_pyproj_wheel.py
      - scripts/patch_pyproj_build.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    outputs:
      pyproj: ${{ steps.read.outputs.pyproj }}
      proj: ${{ steps.read.outputs.proj }}
      proj-sha256: ${{ steps.read.outputs.proj-sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned versions
        id: read
        run: |
          pyproj=$(grep -oP '"pyproj==\K[^"]+' pyproject.toml)
          proj=$(grep -oP '^PROJ_VERSION="\$\{PROJ_VERSION:-\K[^}]+' .devcontainer/install-proj.sh)
          sha=$(grep -oP '^PROJ_SHA256="\$\{PROJ_SHA256:-\K[^}]+' .devcontainer/install-proj.sh)
          echo "pyproj $pyproj with PROJ $proj ($sha)"
          {
            echo "pyproj=$pyproj"
            echo "proj=$proj"
            echo "proj-sha256=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    needs: pins
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
          - { os: macos-14, arch: arm64, macos-target: "14.0" }
          - { os: macos-15-intel, arch: x86_64, macos-target: "15.0" }
          - { os: windows-2022, arch: AMD64, triplet: x64-windows }
    env:
      PYPROJ_VERSION: ${{ needs.pins.outputs.pyproj }}
      PROJ_VERSION: ${{ needs.pins.outputs.proj }}
      PROJ_SHA256: ${{ needs.pins.outputs.proj-sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out pyproj ${{ env.PYPROJ_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: pyproj4/pyproj
          ref: ${{ env.PYPROJ_VERSION }}
          path: pyproj-src
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # proj-compile-wheels.sh downloads PROJ unchecked unless the archive is
      # already in archives/, so the checked one is put there first.
      - name: Fetch the PROJ source and check its checksum
        shell: bash
        run: |
          mkdir -p archives
          archive="archives/proj-${PROJ_VERSION}.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://download.osgeo.org/proj/proj-${PROJ_VERSION}.tar.gz" \
            || curl -fsSL --retry 3 -o "$archive" "https://github.com/OSGeo/PROJ/releases/download/${PROJ_VERSION}/proj-${PROJ_VERSION}.tar.gz"
          actual=$(cmake -E sha256sum "$archive" | cut -d' ' -f1)
          if [[ "$actual" != "$PROJ_SHA256" ]]; then
            echo "::error::$archive has SHA-256 $actual, expected $PROJ_SHA256"
            exit 1
          fi

      # The local version label distinguishes the wheels from PyPI's. Disable
      # embedded resources and make PROJ_DATA take precedence over the bundled
      # database, while retaining pyproj's explicit set_data_dir precedence.
      - name: Patch pyproj's build
        shell: bash
        run: |
          python scripts/patch_pyproj_build.py pyproj-src "$PYPROJ_VERSION" "$PROJ_VERSION"

      - name: Cache the vcpkg dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-${{ hashFiles('pyproj-src/ci/vcpkg.json', '.github/workflows/pyproj-wheels.yml') }}

      # Only PROJ's dependencies come from vcpkg, at the baseline pyproj pins.
      # PROJ itself is built from the checked archive, as on Linux and macOS,
      # so no platform waits for vcpkg to package a PROJ release.
      - name: Install PROJ's dependencies with vcpkg
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg_root=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")
          baseline=$(python -c "import json; print(json.load(open('pyproj-src/ci/vcpkg.json'))['builtin-baseline'])")

          mkdir -p vcpkg-manifest
          cat > vcpkg-manifest/vcpkg.json <<EOF
          {
            "dependencies": [{"name": "sqlite3", "features": ["tool"]}, "tiff", "curl"],
            "builtin-baseline": "$baseline"
          }
          EOF

          # Workaround for https://github.com/microsoft/vcpkg/issues/41199, as in
          # pyproj's workflow. Kept to this step: MSBuild, which CMake runs below,
          # fails on variables that differ only in case.
          export SystemDrive="$SYSTEMDRIVE" SystemRoot="$SYSTEMROOT" windir="$WINDIR"
          git -C "$vcpkg_root" pull --quiet
          "$vcpkg_root/bootstrap-vcpkg.bat" -disableMetrics
          "$vcpkg_root/vcpkg" install --x-manifest-root=vcpkg-manifest \
            --x-install-root="$vcpkg_root/installed" --triplet ${{ matrix.triplet }}

      - name: Build PROJ
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT.Replace('\', '/')
          $installed = "$vcpkg/installed"
          $triplet = '${{ matrix.triplet }}'
          $prefix = "$env:GITHUB_WORKSPACE/pyproj-src/pyproj/proj_dir".Replace('\', '/')
          $sqlite3 = Get-ChildItem "$installed/$triplet/tools" -Recurse -Filter sqlite3.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sqlite3) { throw "no sqlite3.exe under $installed/$triplet/tools" }

          cmake -E tar xzf "archives/proj-$env:PROJ_VERSION.tar.gz"
          cmake -S "proj-$env:PROJ_VERSION" -B proj-build -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            "-DVCPKG_INSTALLED_DIR=$installed" `
            "-DCMAKE_INSTALL_PREFIX=$prefix" `
            "-DEXE_SQLITE3=$sqlite3" `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_TESTING=OFF `
            -DBUILD_APPS=OFF `
            -DENABLE_TIFF=ON `
            -DENABLE_CURL=ON `
            -DEMBED_RESOURCE_FILES=OFF `
            -DUSE_ONLY_EMBEDDED_RESOURCE_FILES=OFF
          cmake --build proj-build --config Release --parallel
          cmake --install proj-build --config Release

          Add-Content $env:GITHUB_ENV "PROJ_PREFIX=$prefix"
          Add-Content $env:GITHUB_ENV "VCPKG_BIN=$installed/$triplet/bin"

      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v4.3.4
        with:
          package-dir: pyproj-src
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp313-* cp314-* cp315-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: bash -e pyproj-src/ci/proj-compile-wheels.sh
          CIBW_BEFORE_ALL_MACOS: bash -e pyproj-src/ci/proj-compile-wheels.sh
          CIBW_ENVIRONMENT_LINUX: >-
            PROJ_WHEEL=true
            PROJ_VERSION=${{ env.PROJ_VERSION }}
            PROJ_DIR=/project/pyproj-src/pyproj/proj_dir
          CIBW_ENVIRONMENT_MACOS: >-
            PROJ_WHEEL=true
            PROJ_VERSION=${{ env.PROJ_VERSION }}
            PROJ_DIR=${{ github.workspace }}/pyproj-src/pyproj/proj_dir
            BUILD_PREFIX=${{ runner.temp }}/pyproj-deps
            CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}
            CPPFLAGS="-I${BUILD_PREFIX}/include ${CPPFLAGS}"
            PKG_CONFIG_PATH="${BUILD_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}"
            LDFLAGS="-L${BUILD_PREFIX}/lib -Wl,-rpath,${BUILD_PREFIX}/lib ${LDFLAGS} -Wl,-rpath,${{ github.workspace }}/pyproj-src/pyproj/proj_dir/lib"
          CIBW_ENVIRONMENT_WINDOWS: >-
            PROJ_WHEEL=true
            PROJ_VERSION=${{ env.PROJ_VERSION }}
            PROJ_DIR=${{ env.PROJ_PREFIX }}
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel
          # System32 explicitly: https://github.com/adang1345/delvewheel/issues/54
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path C:/Windows/System32
            --add-path ${{ env.PROJ_PREFIX }}/bin --add-path ${{ env.VCPKG_BIN }}
            -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python {project}/scripts/check_pyproj_wheel.py ${{ env.PROJ_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [pins, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
      actions: write  # start the documentation workflow, which writes the index
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYPROJ_VERSION: ${{ needs.pins.outputs.pyproj }}
      PROJ_VERSION: ${{ needs.pins.outputs.proj }}
      TAG: pyproj-${{ needs.pins.outputs.pyproj }}-proj${{ needs.pins.outputs.proj }}
      INDEX: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple/
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Write the checksums
        working-directory: dist
        run: sha256sum -- *.whl > SHA256SUMS

      # Fails if the release exists. A published wheel is never replaced: pip
      # caches and lock files hold its hash. Delete the release to rebuild.
      - name: Create the release
        run: |
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS \
            --target "$GITHUB_SHA" --latest=false \
            --title "pyproj $PYPROJ_VERSION with PROJ $PROJ_VERSION" \
            --notes "pyproj $PYPROJ_VERSION built against PROJ $PROJ_VERSION for geodetic-engine. Install with \`pip install pygeodetic-engine \"pyproj==$PYPROJ_VERSION+proj$PROJ_VERSION\" --extra-index-url $INDEX\`."

      - name: Refresh the package index
        run: gh workflow run docs.yml --ref "${{ github.event.repository.default_branch }}"
