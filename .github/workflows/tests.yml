name: Tests

# The unit and integration tests, kept apart from linting (lint.yml) so a red
# run here always means a test failed. PROJ is built from source at a pinned
# version, so the tests run inside the devcontainer image rather than against
# whatever PROJ the runner happens to have: every expected coordinate depends on
# the pinned PROJ and its EPSG dataset. See .devcontainer/install-proj.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checking out and testing need nothing beyond reading the repository.
permissions:
  contents: read

env:
  # Root, because the runner owns the checked-out tree and uv writes .venv into
  # it. The virtualenv and the coverage data live in the mount so the steps
  # below share one sync and one coverage record.
  DOCKER_RUN: >-
    docker run --rm --user root
    --volume ${{ github.workspace }}:/workspace --workdir /workspace
    geodetic-engine-devcontainer:ci

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Compiling PROJ and fetching the 750 MB of grids is most of this job,
      # and both only change when the Dockerfile or the install script does.
      # Same context and cache as the lint workflow, so this is a cache hit
      # whenever either has already built the image.
      - name: Build the devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          load: true
          tags: geodetic-engine-devcontainer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --locked fails on a lockfile that no longer matches pyproject.toml.
      # --frozen would instead install whatever the stale lockfile says, which
      # is how a dependency silently disappears from the environment. The
      # environment guards then run on their own and first: if pyproj linked
      # against a vendored PROJ instead of the pinned one, everything below
      # would be answered by a different EPSG dataset and the failures would
      # read as geodesy rather than as a broken build.
      - name: Install dependencies and check the environment
        run: |
          $DOCKER_RUN bash -euo pipefail -c '
            uv sync --locked --extra dev
            uv run --no-sync pytest tests/test_environment.py -q
          '

      # Everything under tests/ except the exhaustive sweep: the unit tests of
      # each module and the integration tests that run real transformations
      # against PROJ and its database. pyproject.toml deselects the dataset
      # marker by default.
      - name: Unit and integration tests
        run: |
          $DOCKER_RUN uv run --no-sync pytest -n logical -q --cov=geodetic_engine --cov-report=

      # The exhaustive sweep over tests/testdataset: every recorded case is
      # transformed with this package and compared with its expected values.
      # It runs even when the step above failed, so a reviewer sees both results.
      - name: Dataset sweep (cross-engine regression)
        if: ${{ !cancelled() }}
        run: |
          $DOCKER_RUN uv run --no-sync pytest -o addopts="" -m dataset -n logical -q --cov=geodetic_engine --cov-append --cov-report=

      # Coverage of both steps together, which is what the floor applies to.
      - name: Coverage
        run: |
          $DOCKER_RUN uv run --no-sync coverage report --fail-under=80
