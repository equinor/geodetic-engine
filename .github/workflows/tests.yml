name: Tests

# The unit and integration tests, kept apart from linting (lint.yml) so a red
# run here always means a test failed. PROJ is built from source at a pinned
# version, so the tests run inside the devcontainer image rather than against
# whatever PROJ the runner happens to have: every expected coordinate depends on
# the pinned PROJ and its EPSG dataset. See .devcontainer/install-proj.sh. The
# Windows job instead tests the installed package against the pyproj wheel
# built for the same PROJ.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checking out and testing need nothing beyond reading the repository.
permissions:
  contents: read

env:
  # Root, because the runner owns the checked-out tree and uv writes .venv into
  # it. The virtualenv and the coverage data live in the mount so the steps
  # below share one sync and one coverage record.
  DOCKER_RUN: >-
    docker run --rm --user root
    --volume ${{ github.workspace }}:/workspace --workdir /workspace
    geodetic-engine-devcontainer:ci

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Compiling PROJ and fetching the 750 MB of grids is most of this job,
      # and both only change when the Dockerfile or the install script does.
      # Same context and cache as the lint workflow, so this is a cache hit
      # whenever either has already built the image.
      - name: Build the devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          load: true
          tags: geodetic-engine-devcontainer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --locked fails on a lockfile that no longer matches pyproject.toml.
      # --frozen would instead install whatever the stale lockfile says, which
      # is how a dependency silently disappears from the environment. The
      # environment guards then run on their own and first: if pyproj linked
      # against a vendored PROJ instead of the pinned one, everything below
      # would be answered by a different EPSG dataset and the failures would
      # read as geodesy rather than as a broken build.
      - name: Install dependencies and check the environment
        run: |
          $DOCKER_RUN bash -euo pipefail -c '
            uv sync --locked --extra dev
            uv run --no-sync pytest tests/test_environment.py -q
          '

      # Everything under tests/ except the exhaustive sweep: the unit tests of
      # each module and the integration tests that run real transformations
      # against PROJ and its database. pyproject.toml deselects the dataset
      # marker by default.
      - name: Unit and integration tests
        run: |
          $DOCKER_RUN uv run --no-sync pytest -n logical -q --cov=geodetic_engine --cov-report=

      # The bin grid property tests run fixed Hypothesis examples above, for a
      # reproducible run. Here they draw fresh ones, so a strategy or tolerance
      # that only holds for the fixed examples is caught before a Hypothesis or
      # Python upgrade changes which examples the fixed seed gives.
      - name: Property tests with fresh examples
        if: ${{ !cancelled() }}
        run: |
          $DOCKER_RUN uv run --no-sync pytest tests/bingrid/test_properties.py -q --hypothesis-profile=geodetic-engine-random

      # The exhaustive sweep over tests/testdataset: every recorded case is
      # transformed with this package and compared with its expected values.
      # It runs even when the step above failed, so a reviewer sees both results.
      - name: Dataset sweep (cross-engine regression)
        if: ${{ !cancelled() }}
        run: |
          $DOCKER_RUN uv run --no-sync pytest -o addopts="" -m dataset -n logical -q --cov=geodetic_engine --cov-append --cov-report=

      # Coverage of both steps together, which is what the floor applies to.
      - name: Coverage
        run: |
          $DOCKER_RUN uv run --no-sync coverage report --fail-under=80

  tests-python315:
    name: Python 3.15 tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          load: true
          tags: geodetic-engine-devcontainer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install dependencies and run the test suite
        run: |
          $DOCKER_RUN bash -euo pipefail -c '
            uv sync --locked --extra dev --python "3.15"
            uv run --no-sync python -c "import sys; assert sys.version_info[:2] == (3, 15)"
            uv run --no-sync pytest tests/test_environment.py -q
            PYTHONWARNINGS=default::DeprecationWarning uv run --no-sync pytest -n logical -q
          '

  # The package as a Windows user installs it: no devcontainer, the pinned
  # pyproj wheel, no grids. Linux deletes and replaces files that are still
  # open and syncs read-only handles and directories, so only Windows shows
  # whether building and publishing a database works there.
  tests-windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and the pinned pyproj wheel
        run: >-
          python -m pip install ".[dev]" "pyproj==3.8.0+proj9.9.0"
          --extra-index-url https://equinor.github.io/geodetic-engine/simple/

      # The other guards check the devcontainer's source build and its grids.
      - name: Check the environment
        run: >-
          python -m pytest tests/test_environment.py -q
          -k "test_proj_version or not_patched or no_links or epsg_4326"

      # The ignored modules test the devcontainer's shell scripts.
      - name: Database build tests
        run: >-
          python -m pytest tests/projdb tests/osdudb -n logical -q
          --ignore=tests/projdb/test_grid_alternatives.py
          --ignore=tests/osdudb/test_script.py
          --ignore=tests/osdudb/test_install_script.py

      - name: Build the official OSDU database
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $temp = python -c "import tempfile; print(tempfile.gettempdir())"
          $work = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP osdudb)
          Push-Location $work
          geodetic-osdudb build --official
          if (-not (Test-Path build/proj.db)) { throw "build/proj.db was not written" }
          python -c "import os, pyproj; pyproj.datadir.set_data_dir(os.pathsep.join([os.path.abspath('build'), pyproj.datadir.get_data_dir()])); print(pyproj.CRS.from_authority('OSDU', '2003001').name)"
          Pop-Location
          $left = @(Get-ChildItem $temp -Directory -Filter 'geodetic-projdb-*')
          if ($left) { throw "staging directories left in ${temp}: $($left.Name -join ', ')" }
