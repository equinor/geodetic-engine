name: pypi_release

# Publishes geodetic-engine to TestPyPI or PyPI as pygeodetic-engine, chosen
# when the workflow is run (Actions > pypi_release > Run workflow). PyPI
# refuses geodetic-engine as too close to the existing geodeticengine; the
# import name is still geodetic_engine. Trusted publishing: each index
# trusts this workflow file and the environment named after it, so no token is
# stored. A PyPI release is then tagged v<version> on the commit it was built
# from, with a GitHub release carrying its CHANGELOG.md section.
#
# The package is pure Python. pyproj with the pinned PROJ comes from the index
# pyproj-wheels.yml publishes, not from here. The wheel ships the official OSDU
# catalogue built into that pyproj wheel's own proj.db; the database is built
# here, at release time, and never committed.

run-name: Publish ${{ inputs.version || 'the pyproject.toml version' }} to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      version:
        description: Version to publish, e.g. 0.1.0 or 0.1.0rc1. Leave empty to use the version in pyproject.toml
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      # The input reaches the shell through the environment, never inline, and
      # is limited to public PEP 440 versions before it is written anywhere.
      # PyPI takes only the pyproject.toml version, so its tag names the commit
      # that states it.
      - name: Set the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$TARGET" == pypi && -n "$VERSION" && "$VERSION" != "$declared" ]]; then
            echo "::error::PyPI releases publish the pyproject.toml version, $declared; leave the version empty, or change pyproject.toml first"
            exit 1
          fi
          if [[ -n "$VERSION" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
              echo "::error::'$VERSION' is not a version PyPI accepts, such as 0.1.0, 0.1.0rc1 or 0.1.0.dev1"
              exit 1
            fi
            sed -i -E "s/^version = \"[^\"]*\"$/version = \"$VERSION\"/" pyproject.toml
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ -n "$VERSION" && "$version" != "$VERSION" ]]; then
            echo "::error::could not set the version in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing pygeodetic-engine $version to ${{ inputs.target }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the release tag is free
        if: inputs.target == 'pypi'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          case $status in
            0) echo "::error::tag v$VERSION exists, so $VERSION has been released"; exit 1 ;;
            2) ;;
            *) exit "$status" ;;
          esac

      # In a new environment with the pinned pyproj wheel from the project's
      # index, so the base database is the one users install. Written to
      # geodetic_engine/osdudb/_data/proj_data/proj.db, which is gitignored
      # and which the build backend includes in the sdist and the wheel.
      - name: Build the bundled OSDU database
        run: python scripts/build_bundled_osdudb.py

      - name: Build the sdist and the wheel
        run: uv build

      - name: Check the distributions
        run: uvx twine check --strict dist/*

      # In a new environment holding the wheel and the pyproj wheel it pins:
      # the bundled catalogue and database are checked against that pyproj's
      # own proj.db, then, as a user installs it, with nothing on PROJ_DATA and
      # no build step, OSDU lookups must answer from the database the wheel
      # ships. The pins are read from the wheel, so none is stated here.
      - name: Verify the bundled OSDU database as installed
        run: python scripts/check_installed_wheel.py dist/*.whl dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org' || 'https://test.pypi.org' }}/project/pygeodetic-engine/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  # A job of its own, so only it can write to the repository, and only once
  # PyPI has accepted the upload.
  tag:
    needs: [build, publish]
    if: inputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tag the release and publish it on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v version="$VERSION" '/^## / { section = ($2 == version); next } section' CHANGELOG.md > notes.md
          prerelease=()
          if [[ "$VERSION" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "v$VERSION" "${prerelease[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "pygeodetic-engine $VERSION" --notes-file notes.md
