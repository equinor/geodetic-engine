name: Lint and type check

# PROJ is built from source at a pinned version, so the checks run inside the
# devcontainer image rather than against whatever PROJ the runner happens to
# have. The image comes from the same Dockerfile a contributor develops in; see
# .devcontainer/install-proj.sh. The tests are a separate workflow (tests.yml),
# so a failure here is a style or typing problem and never a failing test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checking out and linting need nothing beyond reading the repository.
permissions:
  contents: read

env:
  # Root, because the runner owns the checked-out tree and uv writes .venv into
  # it. The virtualenv lives in the mount so the steps below share one sync.
  DOCKER_RUN: >-
    docker run --rm --user root
    --volume ${{ github.workspace }}:/workspace --workdir /workspace
    geodetic-engine-devcontainer:ci

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Compiling PROJ and fetching the 750 MB of grids is most of this job,
      # and both only change when the Dockerfile or the install script does.
      # Same context and cache as the test workflow, so this is a cache hit
      # whenever either has already built the image.
      - name: Build the devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          load: true
          tags: geodetic-engine-devcontainer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --locked fails on a lockfile that no longer matches pyproject.toml.
      # --frozen would instead install whatever the stale lockfile says, which
      # is how a dependency silently disappears from the environment.
      - name: Install dependencies
        run: |
          $DOCKER_RUN uv sync --locked --extra dev

      # One container, and the exit status held to the end, so that a style
      # error cannot hide a typing error: a reviewer sees every problem at once.
      - name: Run ruff and mypy
        run: |
          $DOCKER_RUN bash -euo pipefail -c '
            status=0
            check() { echo "::group::$1"; shift; "$@" || status=1; echo "::endgroup::"; }
            check "ruff check"  uv run --no-sync ruff check geodetic_engine tests
            check "ruff format" uv run --no-sync ruff format --check geodetic_engine tests
            check "mypy"        uv run --no-sync mypy geodetic_engine
            exit $status
          '
